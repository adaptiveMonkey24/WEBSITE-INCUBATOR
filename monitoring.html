<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monitoring - Incubator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="icon-btn" title="Home">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/>
      </svg>
    </a>
  </div>

  <div class="title-block">
    <p class="teks-1">Control Engineering and Artificial Intelligence Lab</p>
    <h1 class="teks-2">Monitoring ruangan incubator</h1>
    <nav class="teks-3">
      <a href="monitoring.html">Monitoring</a>
      <a href="riwayat.html">History</a>
      <a href="caution.html">Caution</a>
    </nav>
  </div>

  <div class="topbar-right">
    <a href="#" class="icon-btn lab-logo" title="Lab">
      <img src="assets/logo-cec.png" alt="LAB" />
    </a>
  </div>
</header>

<main class="content">

  <!-- Bar loading koneksi ESP -->
  <div class="conn-bar" id="connBar">
    <div class="spinner"></div>
    <span>Menunggu koneksi ESP...</span>
  </div>

  <!-- 6 kartu ruangan -->
  <section class="rooms-grid" id="roomsGrid"></section>

  <!-- Speedometer fan -->
  <section class="fan-section">
    <h3>SPEED FAN EXHAUST</h3>
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 150" class="gauge">
        <defs>
          <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#16a34a"/>
            <stop offset="50%"  stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#dc2626"/>
          </linearGradient>
        </defs>
        <path d="M20,110 A90,90 0 0 1 200,110" fill="none"
              stroke="#e5e7eb" stroke-width="18" stroke-linecap="round"/>
        <path id="gaugeArc" d="M20,110 A90,90 0 0 1 200,110" fill="none"
              stroke="url(#gaugeGrad)" stroke-width="18" stroke-linecap="round"
              stroke-dasharray="282.7" stroke-dashoffset="282.7"/>
        <line id="gaugeNeedle" x1="110" y1="110" x2="110" y2="42"
              stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
        <circle cx="110" cy="110" r="9" fill="#1e3a8a"/>
        <text id="fanText" x="110" y="145" text-anchor="middle"
              font-size="22" font-weight="800" fill="#1e3a8a">0%</text>
      </svg>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
