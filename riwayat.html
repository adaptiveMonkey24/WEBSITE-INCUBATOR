<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riwayat - Incubator</title>
<link rel="stylesheet" href="style.css" />
<!-- Chart.js dari CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="icon-btn" title="Home">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/>
      </svg>
    </a>
  </div>

  <div class="title-block">
    <p class="teks-1">Control Engineering and Artificial Intelligence Lab</p>
    <h1 class="teks-2">Monitoring ruangan incubator</h1>
    <nav class="teks-3">
      <a href="monitoring.html">Monitoring</a>
      <a href="riwayat.html">History</a>
      <a href="caution.html">Caution</a>
    </nav>
  </div>

  <div class="topbar-right">
    <a href="#" class="icon-btn lab-logo" title="Lab">
      <img src="assets/logo-cec.png" alt="LAB" />
    </a>
  </div>
</header>

<main class="content">

  <!-- Filter -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>Ruangan:</label>
      <select id="roomSelect">
        <option value="1">Ruangan 1</option>
        <option value="2">Ruangan 2</option>
        <option value="3">Ruangan 3</option>
        <option value="4">Ruangan 4</option>
        <option value="5">Ruangan 5</option>
        <option value="6">Ruangan 6</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Tanggal:</label>
      <div class="date-buttons" id="dateButtons"></div>
    </div>
  </div>

  <!-- Ringkasan angka -->
  <div class="summary-cards" id="summaryCards"></div>

  <!-- Grafik -->
  <div class="chart-wrap">
    <h3 id="chartTitle">Riwayat Ruangan 1</h3>
    <div class="chart-canvas-box">
      <canvas id="historyChart"></canvas>
    </div>
  </div>

  <!-- Tabel data -->
  <div class="table-wrap">
    <h3>Detail Data Per Jam</h3>
    <div class="table-scroll">
      <table class="data-table" id="dataTable">
        <thead>
          <tr>
            <th>Jam</th>
            <th>Suhu (°C)</th>
            <th>Cahaya (%)</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="dataTableBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
